name: Source and Runtime audit
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Audit integrity tests
        run: python3 -m unittest discover -s tests -v
      - name: Read fixed source snapshot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: a7987083/mymenu
          ref: 7066edeaf9e47580c89440be670c517280534b69
          path: .audit-source
          persist-credentials: false
          fetch-depth: 0
      - name: Reproduce source hashes and API inventory
        run: python3 tools/verify_source.py .audit-source
  runtime-audit:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify pinned toolchain
        run: |
          set -euo pipefail
          mkdir -p build
          test -d "$DEVELOPER_DIR"
          xcodebuild -version | tee build/toolchain.txt
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = 18.5
          xcrun clang --version | tee -a build/toolchain.txt
      - name: Static analysis
        run: |
          set -euo pipefail
          xcrun clang --analyze -fobjc-arc -fblocks -std=c11 -framework Foundation tests/runtime_audit_fixture.m
      - name: Real Objective-C Runtime experiments
        run: |
          set -euo pipefail
          xcrun clang -fobjc-arc -fblocks -std=c11 -Wall -Wextra -Werror -framework Foundation tests/runtime_audit_fixture.m -o build/runtime-audit
          build/runtime-audit | tee build/runtime-results.txt
      - name: Build ARM64 audit fixture (not product dylib)
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -isysroot "$SDK" -arch arm64 -miphoneos-version-min=14.0 -dynamiclib -fobjc-arc -fblocks -std=c11 -Wall -Wextra -Werror -fvisibility=hidden -DNM_AUDIT_DYLIB=1 -framework Foundation -install_name @rpath/NewMyMenuRuntimeAuditFixture.dylib tests/runtime_audit_fixture.m -o build/NewMyMenuRuntimeAuditFixture.dylib
          codesign --force --sign - --timestamp=none build/NewMyMenuRuntimeAuditFixture.dylib
      - name: Verify audit fixture
        run: |
          set -euo pipefail
          OUT=build/NewMyMenuRuntimeAuditFixture.dylib
          file "$OUT" | tee build/macho.txt
          test "$(lipo -archs "$OUT")" = arm64
          otool -L "$OUT" | tee build/dependencies.txt
          python3 - <<'PY'
          from pathlib import Path
          rows=Path('build/dependencies.txt').read_text().splitlines()[2:]
          for row in rows:
              dep=row.strip().split(' (',1)[0]
              if not dep.startswith(('/System/Library/Frameworks/Foundation.framework/','/usr/lib/')):
                  raise SystemExit('Unexpected dependency: '+dep)
          PY
          nm -gU "$OUT" | tee build/exports.txt
          grep -q '_NewMyMenuRuntimeAuditFixture$' build/exports.txt
          codesign --verify --strict --verbose=4 "$OUT" 2>&1 | tee build/signature.txt
          otool -l "$OUT" > build/load-commands.txt
          grep -q LC_CODE_SIGNATURE build/load-commands.txt
          shasum -a 256 "$OUT" | tee build/SHA256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: runtime-audit-fixture-NOT-PRODUCT-${{ github.sha }}
          path: build/
          if-no-files-found: error

  invoke-contract-audit:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Read exact audited source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: a7987083/mymenu
          ref: 7066edeaf9e47580c89440be670c517280534b69
          path: .audit-source
          persist-credentials: false
      - name: Generate hash-verified source reproduction
        run: |
          set -euo pipefail
          mkdir -p build/invoke-audit
          python3 tools/generate_invoke_audit.py .audit-source build/invoke-audit/invoke-audit.mm
      - name: Build actual M47 and entry methods against controlled boundaries
        run: |
          set -euo pipefail
          xcrun clang++ -std=c++17 -fobjc-arc -fblocks -Wall -Wextra -Werror -framework Foundation -Wl,-export_dynamic build/invoke-audit/invoke-audit.mm -o build/invoke-audit/invoke-audit
      - name: Reproduce known receiver contract defects
        run: |
          set -euo pipefail
          build/invoke-audit/invoke-audit | tee build/invoke-audit/results.txt
      - name: Generate and reproduce capture session timeout defect
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          python3 tools/generate_capture_audit.py .audit-source build/invoke-audit/capture-audit.mm
          xcrun clang++ -std=c++17 -fobjc-arc -fblocks -Wall -Wextra -Werror -framework Foundation build/invoke-audit/capture-audit.mm -o build/invoke-audit/capture-audit
          build/invoke-audit/capture-audit | tee build/invoke-audit/capture-results.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: invoke-contract-evidence-NOT-PRODUCT-${{ github.sha }}
          path: build/invoke-audit/
          if-no-files-found: error

  foundation-core:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Read fixed baseline for regression only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: a7987083/mymenu
          ref: 7066edeaf9e47580c89440be670c517280534b69
          path: .audit-source
          persist-credentials: false
      - name: Portable and Foundation module tests
        run: |
          set -euo pipefail
          make test-portable
          make test-macos
          make test-execution
          make test-discovery
          make test-finder
          make test-manifest
          make test-configuration
          make test-patch-import
          make test-macho-address
          make test-static-plan
          make test-arm64-relocation
          make test-static-values SOURCE_BASELINE=.audit-source
          make test-relocation-parity SOURCE_BASELINE=.audit-source
          make test-static-variant-parity SOURCE_BASELINE=.audit-source
          python3 tools/generate_address_parity.py .audit-source
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -Iinclude -c src/Build/NMMachOAddress.c -o build/tests/address-map.o
          c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -Iinclude build/tests/address-parity.cpp build/tests/address-map.o -o build/tests/address-parity
          build/tests/address-parity
          make test-configuration-parity SOURCE_BASELINE=.audit-source
          make test-swizzle
          make test-presentation
          make test-parser SOURCE_BASELINE=.audit-source
      - name: Regression against fixed original implementation
        run: |
          set -euo pipefail
          make test-parity SOURCE_BASELINE=.audit-source
          make test-patch-import-audit SOURCE_BASELINE=.audit-source
      - name: Static analysis of migrated modules
        run: |
          set -euo pipefail
          mkdir -p build/core
          source scripts/source_lists.sh
          for input in "${NM_C_SOURCES[@]}"; do xcrun clang --analyze -std=c11 -Wall -Wextra -Werror -Iinclude "$input" -o "build/core/$(basename "$input" .c)-analysis.plist"; done
          for input in "${NM_M_SOURCES[@]}"; do xcrun clang --analyze -std=c11 -fobjc-arc -fblocks -Wall -Wextra -Werror -Iinclude "$input" -o "build/core/$(basename "$input" .m)-analysis.plist"; done
          for input in "${NM_MM_SOURCES[@]}"; do xcrun clang++ --analyze -std=c++17 -fobjc-arc -fblocks -Wall -Wextra -Werror -Iinclude -Isrc/Build "$input" -o "build/core/$(basename "$input" .mm)-analysis.plist"; done
          python3 tools/check_analysis.py build/core/*-analysis.plist
      - name: Build and strictly verify ARM64 foundation core
        run: |
          set -euo pipefail
          make core
      - name: Verify transactional reused Mach-O signer
        run: |
          set -euo pipefail
          make test-signer
          make test-static-image
          make test-static-numeric SOURCE_BASELINE=.audit-source
          make test-offline-build
          make test-static-runtime
          build/tests/macho-address build/core/NewMyMenuCore.dylib
          build/tests/static-plan build/core/NewMyMenuCore.dylib
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: newmymenu-foundation-core-NOT-FULL-MENU-${{ github.sha }}
          path: |
            build/core/
            build/signer-fixture/
            build/static-image-fixture/
          if-no-files-found: error

  developer-menu:
    timeout-minutes: 20
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build verified self-contained device probe
        run: |
          set -euo pipefail
          make developer-menu
      - name: Analyze probe UI lifecycle
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang --analyze -isysroot "$SDK" -arch arm64 -miphoneos-version-min=14.0 -std=c11 -fobjc-arc -fblocks -Wall -Wextra -Werror -Iinclude -Isrc/MethodFinder src/DeveloperUI/NMDeveloperMenu.m -o build/developer-menu/NMDeveloperMenu-analysis.plist
          xcrun --sdk iphoneos clang --analyze -isysroot "$SDK" -arch arm64 -miphoneos-version-min=14.0 -std=c11 -fobjc-arc -fblocks -Wall -Wextra -Werror -Isrc/MethodFinder src/MethodFinder/NMFinderSession.m -o build/developer-menu/NMFinderSession-analysis.plist
          xcrun --sdk iphoneos clang --analyze -isysroot "$SDK" -arch arm64 -miphoneos-version-min=14.0 -std=c11 -fobjc-arc -fblocks -Wall -Wextra -Werror -Iinclude -Isrc/MethodFinder src/MethodFinder/NMMethodPresentation.m -o build/developer-menu/NMMethodPresentation-analysis.plist
          python3 tools/check_analysis.py build/developer-menu/*-analysis.plist
      - name: Exercise UIKit in pinned iOS Simulator when installed
        run: bash scripts/test_ui_simulator.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: newmymenu-developer-INTEGRATION-${{ github.sha }}
          path: build/developer-menu/
          if-no-files-found: error
